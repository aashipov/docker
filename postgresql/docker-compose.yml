# sudo rm -rf ${HOME}/docker-volumes/postgres/
# mkdir -p ${HOME}/docker-volumes/postgres/

networks:
  default:
    name: ${POSTGRES}

x-volumes:
  &postgres-volumes
  - ${HOME}/docker-volumes/${POSTGRES}/:/var/lib/postgresql/data/:rw

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    hostname: ${POSTGRES}
    container_name: ${POSTGRES}
    restart: unless-stopped
    # PostgreSQL empty DB initialization only pass with root user credentials. 
    # If you need a root-less container (as more secure, to directly access database files without repetitive chown or store database files on a specific/network drive), initialize a root'ed one, stop, chown volume to DUMMY_UID/DUMMY_UID, uncomment line below and restart container
    #user: ${DUMMY_UID}:${DUMMY_UID}
    volumes: *postgres-volumes
    ports:
      - '5432:5432'
    healthcheck:
      test: [ 'CMD-SHELL', '${POSTGRES_HEALTHCHECK_CMD}' ]
      interval: 5s
      timeout: 60s
      retries: 100
      start_period: 10s
    env_file:
      - '.env'
