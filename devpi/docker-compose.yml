# python3 -c "import base64, secrets; print(base64.b64encode(secrets.token_bytes(32)).decode('ascii'))" > ${HOME}/docker-volumes/devpi/devpi-server-secret
# chmod 0600 ${HOME}/docker-volumes/devpi/devpi-server-secret

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}

x-volumes: &devpi-volumes
  - ${HOME}/docker-volumes/${COMPOSE_PROJECT_NAME}/devpiserver-serverdir/:/${DUMMY_USER}/devpiserver-serverdir/:rw
  - ${HOME}/docker-volumes/${COMPOSE_PROJECT_NAME}/devpi-server-secret:/${DUMMY_USER}/devpi-server-secret:ro
  - ./devpi-server.yml:/${DUMMY_USER}/.config/devpi-server/devpi-server.yml
  - ./run.sh:/${DUMMY_USER}/run.sh:ro

services:
  devpi:
    build:
      dockerfile: Dockerfile
      target: devpi
    container_name: ${COMPOSE_PROJECT_NAME}
    hostname: ${COMPOSE_PROJECT_NAME}
    restart: no
    user: ${DUMMY_UID}:${DUMMY_GID}
    volumes: *devpi-volumes
    env_file:
      - .env
    ports:
      - 8090:8090
    command: ${DUMMY_USER}/run.sh
