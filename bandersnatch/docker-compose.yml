# mkdir -p ${HOME}/docker-volumes/bandersnatch/

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}

x-volumes: &bandersnatch-volumes
  - ${HOME}/docker-volumes/${COMPOSE_PROJECT_NAME}/:/${DUMMY_USER}/pypi/:rw
  - ./run.sh:/${DUMMY_USER}/run.sh:ro
  - ./bandersnatch.conf:/${DUMMY_USER}/bandersnatch.conf:ro

services:
  bandersnatch:
    build:
      dockerfile: Dockerfile
      target: bandersnatch
    container_name: ${COMPOSE_PROJECT_NAME}
    hostname: ${COMPOSE_PROJECT_NAME}
    restart: no
    user: ${DUMMY_UID}:${DUMMY_GID}
    volumes: *bandersnatch-volumes
    env_file:
      - .env
    ports:
      - 8090:80
    command: /${DUMMY_USER}/run.sh
